<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription des stagiaires</title>
  <style>
    body { font-family: system-ui, Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 24px 16px; }
    .carte { max-width: 440px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0 0 4px; }
    p.sous { color: #6b7785; margin: 0 0 16px; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: .9rem; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #d5dbe3; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #2563eb; color: #fff; border: 0; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    #message { margin-top: 16px; padding: 10px 12px; border-radius: 8px; display: none; }
    #message.ok { display: block; background: #e7f7ec; color: #14532d; }
    #message.err { display: block; background: #fdecec; color: #991b1b; }
    a { display: inline-block; margin-top: 16px; color: #2563eb; }
  </style>
</head>
<body>
  <div class="carte">
    <h1>Inscription</h1>
    <p class="sous">Remplissez le formulaire pour vous inscrire.</p>

    <form id="form">
      <label>Nom <input type="text" name="nom" required maxlength="100"></label>
      <label>Prénom <input type="text" name="prenom" required maxlength="100"></label>
      <label>Ville <input type="text" name="ville" required maxlength="100"></label>
      <label>Photo (JPEG, PNG ou WebP, 4 Mo max)
        <input type="file" name="photo" accept="image/jpeg,image/png,image/webp" required>
      </label>
      <button type="submit" id="btn">S'inscrire</button>
    </form>

    <div id="message"></div>
    <a href="liste.html">Voir la liste des stagiaires</a>
  </div>

  <script>
    const form = document.getElementById('form');
    const message = document.getElementById('message');
    const btn = document.getElementById('btn');

    function afficher(texte, ok) {
      message.textContent = texte;
      message.className = ok ? 'ok' : 'err';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      afficher('Envoi en cours...', true);

      try {
        const res = await fetch('/api/inscrire.php', {
          method: 'POST',
          body: new FormData(form)
        });
        const texte = await res.text();
        let data = null;
        try { data = JSON.parse(texte); } catch (_) { console.error(texte); }

        if (res.ok && data && data.success) {
          afficher(data.message, true);
          form.reset();
        } else {
          afficher((data && data.message) || 'Erreur serveur (code ' + res.status + ').', false);
        }
      } catch (err) {
        afficher('Erreur réseau : ' + err.message, false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
